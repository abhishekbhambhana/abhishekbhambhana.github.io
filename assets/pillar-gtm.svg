<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="590" height="300" viewBox="0 0 590 300" role="img" aria-label="GTM: outbound go-to-market for IT services and SaaS startups">
<title>GTM: outbound go-to-market for IT services and SaaS startups</title>
<style>
  .rise { opacity:0; animation: rise .9s cubic-bezier(.23,1,.32,1) forwards; }
  @keyframes rise { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform:none; } }
  .fade { opacity:0; animation: fade 1.2s ease forwards; }
  @keyframes fade { to { opacity:1; } }
  .blink { animation: blink 1.4s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.2; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01s !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; }
    .rise, .fade { opacity:1; }
  }
.drop { opacity:0; animation: fall 2.8s cubic-bezier(.77,0,.175,1) infinite; transform-box: fill-box; }
@keyframes fall { 0% { opacity:0; transform: translate(0,-6px); } 10% { opacity:1; } 80% { opacity:1; transform: translate(0,150px); } 100% { opacity:0; transform: translate(0,162px); } }
.drop:nth-of-type(2), .drop:nth-of-type(4) { animation-name: fall2; }
@keyframes fall2 { 0% { opacity:0; transform: translate(0,-6px); } 10% { opacity:1; } 45% { opacity:0; transform: translate(0,80px); } 100% { opacity:0; } }</style>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#294032"/></pattern>
<clipPath id="fr"><rect width="590" height="300" rx="20"/></clipPath>
</defs>
<g clip-path="url(#fr)">
<rect width="590" height="300" fill="#07110d"/>
<rect width="590" height="300" fill="url(#dots)" opacity=".55"/>

</g>
<rect x=".5" y=".5" width="589" height="299" rx="19.5" fill="none" stroke="#1d3127"/>
<rect x="0" y="0" width="590" height="4" fill="#caff45" opacity=".0"/>
<g transform="translate(330 34)"><path d="M10 10 H230 L190 58 H50 Z" fill="#0f1d17" stroke="#294032"/>
<path d="M50 66 H190 L160 106 H80 Z" fill="#0f1d17" stroke="#294032"/>
<path d="M80 114 H160 L140 146 H100 Z" fill="#294032" stroke="#caff45" stroke-opacity=".6"/>
<text x="120" y="38" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#8eaa9a">ICP · 200 ACCOUNTS</text>
<text x="120" y="90" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#8eaa9a">REPLIES</text>
<text x="120" y="135" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#dcff8c">MEETINGS</text><circle class="drop" style="animation-delay:0s" cx="70" cy="0" r="4" fill="#caff45"/><circle class="drop" style="animation-delay:0.7s" cx="120" cy="0" r="4" fill="#caff45"/><circle class="drop" style="animation-delay:1.4s" cx="170" cy="0" r="4" fill="#caff45"/><circle class="drop" style="animation-delay:2.1s" cx="120" cy="0" r="4" fill="#caff45"/></g>
<g class="rise" style="animation-delay:.05s">
  <text x="34" y="60" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="2" fill="#caff45">02  ·  GO-TO-MARKET</text>
</g>
<g class="rise" style="animation-delay:.12s">
  <text x="34" y="104" font-family="'Inter Tight', 'Inter', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="750" font-size="34" letter-spacing="-1" fill="#f4f5ef">GTM, 0 to 1</text>
</g>
<g class="rise" style="animation-delay:.18s">
  <text x="34" y="134" font-family="'Instrument Serif', 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" fill="#8eaa9a">Outbound for IT &amp; SaaS</text>
</g>
<g class="rise" style="animation-delay:0.26s"><circle cx="40" cy="196" r="3" fill="#caff45"/><text x="54" y="201" font-family="'Inter Tight', 'Inter', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#f4f5ef">Built outbound GTM for five startups</text></g><g class="rise" style="animation-delay:0.32s"><circle cx="40" cy="226" r="3" fill="#caff45"/><text x="54" y="231" font-family="'Inter Tight', 'Inter', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#f4f5ef">One grew revenue 5x</text></g><g class="rise" style="animation-delay:0.38s"><circle cx="40" cy="256" r="3" fill="#caff45"/><text x="54" y="261" font-family="'Inter Tight', 'Inter', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#f4f5ef">Sales cycles cut 30 to 45%</text></g>
</svg>
