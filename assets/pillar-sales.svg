<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="590" height="300" viewBox="0 0 590 300" role="img" aria-label="Tech sales: business development for SaaS and IT services">
<title>Tech sales: business development for SaaS and IT services</title>
<style>
  .rise { opacity:0; animation: rise .9s cubic-bezier(.23,1,.32,1) forwards; }
  @keyframes rise { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform:none; } }
  .fade { opacity:0; animation: fade 1.2s ease forwards; }
  @keyframes fade { to { opacity:1; } }
  .blink { animation: blink 1.4s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.2; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01s !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; }
    .rise, .fade { opacity:1; }
  }
.deal { opacity:0; animation: move 4.8s cubic-bezier(.77,0,.175,1) infinite; }
@keyframes move { 0% { opacity:0; transform: translate(14px,0); } 8% { opacity:1; } 30% { transform: translate(86px,0); } 55% { transform: translate(158px,0); } 80% { opacity:1; transform: translate(230px,0); } 92%,100% { opacity:0; transform: translate(230px,0); } }</style>
<defs>
