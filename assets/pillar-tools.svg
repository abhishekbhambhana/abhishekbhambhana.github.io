<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="590" height="300" viewBox="0 0 590 300" role="img" aria-label="Tools and automation: UGD Scout, proposal pipeline, AI agents, lead automation">
<title>Tools and automation: UGD Scout, proposal pipeline, AI agents, lead automation</title>
<style>
  .rise { opacity:0; animation: rise .9s cubic-bezier(.23,1,.32,1) forwards; }
  @keyframes rise { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform:none; } }
  .fade { opacity:0; animation: fade 1.2s ease forwards; }
  @keyframes fade { to { opacity:1; } }
  .blink { animation: blink 1.4s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.2; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01s !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; }
    .rise, .fade { opacity:1; }
  }
.flow { stroke-dasharray: 18 200; stroke-dashoffset: 120; animation: flow 1.4s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -100; } }
.core { transform-box: fill-box; transform-origin: center; animation: core 2.8s ease-in-out infinite; }
@keyframes core { 50% { transform: scale(1.08); } }</style>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#294032"/></pattern>
<clipPath id="fr"><rect width="590" height="300" rx="20"/></clipPath>
</defs>
