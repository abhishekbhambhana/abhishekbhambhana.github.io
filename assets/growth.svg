<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Upwork accounts scaled to $100K, $200K and $300K+">
<title>Upwork accounts scaled to $100K, $200K and $300K+</title>
<style>
  .rise { opacity:0; animation: rise .9s cubic-bezier(.23,1,.32,1) forwards; }
  @keyframes rise { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform:none; } }
  .fade { opacity:0; animation: fade 1.2s ease forwards; }
  @keyframes fade { to { opacity:1; } }
  .blink { animation: blink 1.4s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.2; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01s !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; }
    .rise, .fade { opacity:1; }
  }
.gbar { transform-box: fill-box; transform-origin: left; transform: scaleX(.02); animation: gx 1.4s cubic-bezier(.23,1,.32,1) forwards; }
@keyframes gx { to { transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) { .gbar { transform:none } }</style>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#294032"/></pattern>
<clipPath id="fr"><rect width="1200" height="300" rx="22"/></clipPath>
</defs>
<g clip-path="url(#fr)">
<rect width="1200" height="300" fill="#07110d"/>
<rect width="1200" height="300" fill="url(#dots)" opacity=".55"/>

</g>
<rect x=".5" y=".5" width="1199" height="299" rx="21.5" fill="none" stroke="#1d3127"/>
<text x="40" y="52" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="2" fill="#caff45">LONG-TERM UPWORK ACCOUNTS, ZERO TO</text>
<text x="40" y="80" font-family="'Instrument Serif', 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-style="italic" font-size="24" fill="#f4f5ef">Fresh profiles to 3 active contracts in 30 days, then into six-figure relationships.</text>
<text x="40" y="130" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.5" fill="#8eaa9a">ACCOUNT A</text><rect x="200" y="108" width="760" height="32" rx="8" fill="#0f1d17"/><rect class="gbar" style="animation-delay:0.15s" x="200" y="108" width="253" height="32" rx="8" fill="#294032"/><text class="rise" style="animation-delay:0.90s" x="469" y="131" font-family="'Inter Tight', 'Inter', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="22" fill="#f4f5ef">$100K</text><text x="40" y="186" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.5" fill="#8eaa9a">ACCOUNT B</text><rect x="200" y="164" width="760" height="32" rx="8" fill="#0f1d17"/><rect class="gbar" style="animation-delay:0.27s" x="200" y="164" width="507" height="32" rx="8" fill="#294032"/><text class="rise" style="animation-delay:1.02s" x="723" y="187" font-family="'Inter Tight', 'Inter', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="22" fill="#f4f5ef">$200K</text><text x="40" y="242" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.5" fill="#8eaa9a">ACCOUNT C</text><rect x="200" y="220" width="760" height="32" rx="8" fill="#0f1d17"/><rect class="gbar" style="animation-delay:0.39s" x="200" y="220" width="760" height="32" rx="8" fill="#caff45"/><text class="rise" style="animation-delay:1.14s" x="976" y="243" font-family="'Inter Tight', 'Inter', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="22" fill="#caff45">$300K+</text>
</svg>
