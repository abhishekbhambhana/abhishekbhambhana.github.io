<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="How an Upwork account wins: radar, score, proposal, interview, contract">
<title>How an Upwork account wins: radar, score, proposal, interview, contract</title>
<style>
  .rise { opacity:0; animation: rise .9s cubic-bezier(.23,1,.32,1) forwards; }
  @keyframes rise { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform:none; } }
  .fade { opacity:0; animation: fade 1.2s ease forwards; }
  @keyframes fade { to { opacity:1; } }
  .blink { animation: blink 1.4s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.2; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01s !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; }
    .rise, .fade { opacity:1; }
  }
.lit { opacity:0; animation: lit 6.0s ease infinite; }
@keyframes lit { 0% { opacity:1; } 10% { opacity:1; } 18%,100% { opacity:0; } }
.comet { animation: run 6.0s linear infinite; }
@keyframes run { 0% { transform: translateX(0); opacity:0; } 5% { opacity:1; } 84% { transform: translateX(980px); opacity:1; } 92%,100% { transform: translateX(980px); opacity:0; } }</style>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#294032"/></pattern>
<clipPath id="fr"><rect width="1200" height="250" rx="22"/></clipPath>
</defs>
<g clip-path="url(#fr)">
<rect width="1200" height="250" fill="#07110d"/>
<rect width="1200" height="250" fill="url(#dots)" opacity=".55"/>

