<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="590" height="300" viewBox="0 0 590 300" role="img" aria-label="Upwork growth: done-for-you Upwork account management by Upwork Growth Desk">
<title>Upwork growth: done-for-you Upwork account management by Upwork Growth Desk</title>
<style>
  .rise { opacity:0; animation: rise .9s cubic-bezier(.23,1,.32,1) forwards; }
  @keyframes rise { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform:none; } }
  .fade { opacity:0; animation: fade 1.2s ease forwards; }
  @keyframes fade { to { opacity:1; } }
  .blink { animation: blink 1.4s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.2; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01s !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; }
    .rise, .fade { opacity:1; }
  }
.bar { transform-box: fill-box; transform-origin: bottom; transform: scaleY(.05); animation: grow 1.1s cubic-bezier(.23,1,.32,1) forwards; }
@keyframes grow { to { transform: scaleY(1); } }
.trend { stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 1.6s cubic-bezier(.23,1,.32,1) .5s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.tip { opacity:0; animation: fade .3s ease 1.9s forwards, pulse 2s ease-in-out 2.2s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 50% { transform: scale(1.6); opacity:.5; } }
@media (prefers-reduced-motion: reduce) { .bar { transform:none } .trend { stroke-dashoffset:0 } .tip { opacity:1 } }</style>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#294032"/></pattern>
<clipPath id="fr"><rect width="590" height="300" rx="20"/></clipPath>
</defs>
<g clip-path="url(#fr)">
<rect width="590" height="300" fill="#07110d"/>
<rect width="590" height="300" fill="url(#dots)" opacity=".55"/>

