</g>
<g class="rise" style="animation-delay:0.26s"><circle cx="40" cy="196" r="3" fill="#caff45"/><text x="54" y="201" font-family="'Inter Tight', 'Inter', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#f4f5ef">Done-for-you account management</text></g><g class="rise" style="animation-delay:0.32s"><circle cx="40" cy="226" r="3" fill="#caff45"/><text x="54" y="231" font-family="'Inter Tight', 'Inter', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#f4f5ef">Profile SEO, proposals, interviews</text></g><g class="rise" style="animation-delay:0.38s"><circle cx="40" cy="256" r="3" fill="#caff45"/><text x="54" y="261" font-family="'Inter Tight', 'Inter', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#f4f5ef">Flat fee, zero commission, 100% JSS</text></g>
