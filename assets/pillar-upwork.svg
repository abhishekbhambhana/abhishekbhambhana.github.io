<rect x=".5" y=".5" width="589" height="299" rx="19.5" fill="none" stroke="#1d3127"/>
<rect x="0" y="0" width="590" height="4" fill="#caff45" opacity=".0"/>
<g transform="translate(330 34)"><line x1="0" y1="152" x2="240" y2="152" stroke="#294032"/><rect class="bar" style="animation-delay:0.00s" x="20" y="116" width="22" height="34" rx="5" fill="#294032"/><rect class="bar" style="animation-delay:0.09s" x="56" y="92" width="22" height="58" rx="5" fill="#294032"/><rect class="bar" style="animation-delay:0.18s" x="92" y="100" width="22" height="50" rx="5" fill="#294032"/><rect class="bar" style="animation-delay:0.27s" x="128" y="64" width="22" height="86" rx="5" fill="#294032"/><rect class="bar" style="animation-delay:0.36s" x="164" y="46" width="22" height="104" rx="5" fill="#294032"/><rect class="bar" style="animation-delay:0.45s" x="200" y="18" width="22" height="132" rx="5" fill="#caff45"/>
<path class="trend" d="M31 108 L67 86 L103 94 L139 58 L175 40 L211 12" fill="none" stroke="#caff45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="tip" cx="211" cy="12" r="5" fill="#caff45"/></g>
<g class="rise" style="animation-delay:.05s">
  <text x="34" y="60" font-family="'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="2" fill="#caff45">01  ·  UPWORK GROWTH</text>
</g>
<g class="rise" style="animation-delay:.12s">
